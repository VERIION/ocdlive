<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OCD Live – Réservez votre live de vente</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--sf:#fff;--tx:#14161a;--mu:#5f6670;--ln:#e1e4e9;--ac:#e8601c;--acs:#fde9dd;--ok:#14894f;--wa:#b87500;--er:#c9372f;--ink:#14161a;--r:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--sf:#181b20;--tx:#f1f2f4;--mu:#9aa1ab;--ln:#2a2e35;--acs:#35200f;--ink:#000}}
:root[data-theme="dark"]{--bg:#0f1114;--sf:#181b20;--tx:#f1f2f4;--mu:#9aa1ab;--ln:#2a2e35;--acs:#35200f;--ink:#000}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.hd>div{max-width:1100px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.lg{font:800 22px "Bricolage Grotesque",sans-serif;text-decoration:none;color:var(--tx);display:flex;align-items:center;gap:8px;margin-right:auto}
.lg i{width:26px;height:26px;border-radius:50%;border:5px solid var(--ac);display:inline-block;position:relative}
.lg i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ac);animation:p 1.8s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
.lg b{color:var(--ac)}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--ac);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;justify-content:center}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.s{padding:7px 14px;min-height:36px;font-size:14px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--ln);background:transparent}
main{max-width:1100px;margin:auto;padding:0 20px 60px}
.hero{background:var(--ink);color:#fff;border-radius:24px;margin-top:20px;padding:clamp(28px,6vw,64px);display:grid;gap:28px;grid-template-columns:1.3fr 1fr;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-90px;top:-90px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(232,96,28,.5),transparent 68%)}
.hero>*{position:relative}
.hero h1{font-size:clamp(34px,6vw,62px);font-weight:800}
.hero p{color:#c7ccd4;max-width:46ch;margin:16px 0 24px}
.air{display:inline-flex;gap:8px;align-items:center;background:#ffffff14;border-radius:999px;padding:6px 14px;font-size:14px;margin-bottom:18px}
.air s{width:9px;height:9px;border-radius:50%;background:#ff4a3d;animation:p 1.4s infinite}
.cd{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cd div{background:#ffffff12;border:1px solid #ffffff22;border-radius:16px;padding:16px;text-align:center}
.cd b{display:block;font:800 40px "Bricolage Grotesque",sans-serif}.cd span{font-size:13px;color:#c7ccd4}
.cdt{grid-column:1/-1;font-size:14px;color:#c7ccd4;margin:0 0 4px}
section{margin-top:56px}
h2{font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:8px}
.sub{color:var(--mu);margin:0 0 24px;max-width:60ch}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px}
.how h3{font-size:19px;margin-bottom:6px}.how p{margin:0;color:var(--mu)}
.wiz{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:clamp(18px,4vw,32px)}
.prog{display:flex;gap:6px;margin-bottom:22px}.prog i{flex:1;height:5px;border-radius:9px;background:var(--ln)}.prog i.on{background:var(--ac)}
.wiz h3{font-size:24px;margin-bottom:4px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:18px}
.opt{text-align:left;background:var(--bg);border:2px solid transparent;border-radius:var(--r);padding:16px;display:block;width:100%}
.opt:hover{border-color:var(--ln)}.opt.sel{border-color:var(--ac);background:var(--acs)}
.opt:disabled{opacity:.4;cursor:not-allowed}.opt strong{display:block;font-size:17px}.opt small{color:var(--mu)}
.opt .pr{font:800 22px "Bricolage Grotesque",sans-serif;margin-top:8px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:18px}
.cal span{text-align:center;font-size:13px;color:var(--mu);padding:4px 0}
.cal button{aspect-ratio:1;min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:600}
.cal button.sel{background:var(--ac);color:#fff;border-color:var(--ac)}.cal button:disabled{opacity:.3;background:transparent;cursor:not-allowed}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.fg{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:18px}.fg .w{grid-column:1/-1}
label{display:grid;gap:5px;font-size:14px;font-weight:600}
input,select,textarea{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:11px 12px;min-height:44px;width:100%}
.rec{background:var(--acs);border-radius:var(--r);padding:14px 16px;margin-top:18px;font-size:15px}
.err{color:var(--er);font-size:13px;font-weight:500}
.ok{text-align:center;padding:20px 0}.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;display:grid;place-items:center;margin:0 auto 14px}
.ref{font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:.04em;color:var(--ac)}
.pk{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pk .card h3{font-size:20px}.pk .card p{color:var(--mu);margin:6px 0 12px}.pk .big{font:800 28px "Bricolage Grotesque",sans-serif}
.tag{font-size:12px;font-weight:600;background:var(--acs);color:var(--ac);border-radius:999px;padding:3px 10px;display:inline-block;margin-bottom:8px}
footer{margin-top:60px;color:var(--mu);font-size:14px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--mu)}
/* admin */
.adm{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:20px}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start}
.side button{text-align:left;border:0;background:transparent;border-radius:12px;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;min-height:44px}
.side button.on{background:var(--ac);color:#fff}.side button:not(.on):hover{background:var(--sf)}
.bd{background:var(--er);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.kp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kp .card b{font:800 28px "Bricolage Grotesque",sans-serif;display:block}.kp .card span{color:var(--mu);font-size:14px}
.bars{display:flex;gap:14px;align-items:flex-end;height:150px;margin-top:14px}
.bars div{flex:1;text-align:center;font-size:13px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{background:var(--ac);border-radius:8px 8px 0 0;min-height:4px;display:block;margin-bottom:6px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:13px}
.st{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;display:inline-block}
.s-pending{background:#fff1d6;color:var(--wa)}.s-confirmed{background:#d9f3e6;color:var(--ok)}.s-done{background:#e4e8ee;color:#3c4452}.s-cancelled{background:#fbe0de;color:var(--er)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tb input,.tb select{width:auto;flex:1;min-width:150px}
.nt{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.nt:last-child{border:0}.nt.new::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ac);margin-top:7px;flex:none}
.lock{max-width:380px;margin:60px auto;text-align:center}
.tc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;z-index:50;font-weight:600;box-shadow:0 8px 30px #0005}
@media (max-width:760px){.hero,.how{grid-template-columns:1fr}.adm{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;position:static}.side button{white-space:nowrap;gap:8px}.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hd"><div>
<a class="lg" href="#"><i></i>OCD <b>Live</b></a>
<button class="btn g s" id="bAdm">Espace admin</button>
<button class="ic" id="bTh" aria-label="Changer le thème">◐</button>
</div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("fr-FR").replace(/\u202f/g," ")+" FCFA";
const SLOTS=["09:00 – 10:30","11:00 – 12:30","14:00 – 15:30","16:00 – 17:30","18:00 – 19:30"];
const ST={pending:"En attente",confirmed:"Confirmé",done:"Réalisé",cancelled:"Annulé"};
const MODES={onsite:"Présentiel à Lomé",remote:"À distance"};
const dl=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
function seed(){
 const P=[
 {id:"p1",name:"Live Flash",dur:"1h30",price:15000,desc:"Un créneau d’1h30 avec régie dédiée, diffusé sur House of Challenge.",tag:"Le plus choisi",on:1},
 {id:"p2",name:"Live Assisté",dur:"1h30",price:20000,desc:"Vous vendez depuis votre boutique, notre assistante vous accompagne depuis le studio.",tag:"À distance",on:1,only:"remote"},
 {id:"p3",name:"Double Live",dur:"3h",price:27000,desc:"Deux créneaux d’affilée pour présenter toute votre gamme.",tag:"",on:1},
 {id:"p4",name:"Marathon",dur:"4h",price:34000,desc:"Quatre heures de live à tarif dégressif, pour les gros volumes.",tag:"Tarif dégressif",on:1},
 {id:"p5",name:"Boost Annonce",dur:"1h30",price:25000,desc:"Votre live annoncé depuis le compte House of Challenge avant le passage à l’antenne.",tag:"Visibilité",on:1},
 {id:"p6",name:"Pass Mois",dur:"4 lives",price:50000,desc:"Un live par semaine pendant un mois, avec annonce de chaque passage.",tag:"Meilleur prix",on:1}];
 const b=(i,n,biz,mode,d,s,p,st,ph)=>({id:"b"+i,ref:"OCD-"+(1000+i),name:n,biz,mode,date:d,slot:SLOTS[s],pkg:p,status:st,phone:ph,email:"",country:mode=="remote"?"Cameroun":"Togo",product:"",created:Date.now()-i*3600e3});
 const B=[b(1,"Afi Mensah","Plats cuisinés","onsite","2026-12-01",0,"p1","confirmed","+228 90 00 11 22"),b(2,"Brice Ndzana","Vêtements","remote","2026-12-01",2,"p2","pending","+237 6 70 00 00 00"),b(3,"Kossi Agbeko","Cosmétiques","onsite","2026-12-03",1,"p5","confirmed","+228 91 22 33 44"),b(4,"Mariam Sy","Tissus wax","remote","2026-12-08",3,"p2","pending","+221 77 000 00 00"),b(5,"Edem Dosseh","Électronique","onsite","2026-12-10",4,"p4","confirmed","+228 92 11 00 99"),b(6,"Chantal Eba","Jus naturels","remote","2026-12-15",0,"p6","cancelled","+237 6 99 00 11 22")];
 return{packages:P,bookings:B,notifs:[{id:"n1",t:Date.now()-7200e3,msg:"Nouvelle réservation : Brice Ndzana (Vêtements), 1 déc., à distance",read:0}],pin:"1234"};
}
let db=(()=>{try{const s=localStorage.getItem("ocd-v1");if(s)return JSON.parse(s)}catch(e){}return seed()})();
const save=()=>{try{localStorage.setItem("ocd-v1",JSON.stringify(db))}catch(e){}};
function toast(m){const t=document.createElement("div");t.className="tc";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}
const pk=id=>db.packages.find(p=>p.id==id)||{name:"?",price:0,dur:""};
const taken=(d,s)=>db.bookings.some(b=>b.date==d&&b.slot==s&&b.status!="cancelled");
let w={step:0,mode:null,date:null,slot:null,pkg:null,f:{},ref:null,err:{}},tab="dash",authed=false,q="",fs="";
/* ---------- PUBLIC ---------- */
function home(){
 $("#app").innerHTML=`<div class="hero"><div><span class="air"><s></s>Ouverture des lives le 1er décembre</span>
 <h1>Vendez en direct. Soyez vu partout en Afrique.</h1>
 <p>Réservez votre créneau dans notre studio de Lomé, ou vendez depuis chez vous avec une assistante à vos côtés. Placez votre produit, votre numéro et votre adresse devant ceux qui ont besoin de vous.</p>
 <button class="btn" onclick="document.getElementById('book').scrollIntoView()">Réserver mon live</button></div>
 <div class="cd" id="cd"></div></div>
 <section><h2>Comment ça marche</h2><p class="sub">Trois étapes, moins de deux minutes.</p>
 <div class="how"><div class="card"><h3>Choisissez le format</h3><p>Présentiel au studio de Lomé, ou à distance depuis votre boutique.</p></div>
 <div class="card"><h3>Réservez votre créneau</h3><p>Une date en décembre, une heure, un package. Nous confirmons rapidement.</p></div>
 <div class="card"><h3>Passez à l’antenne</h3><p>Une régie dirige votre live. Vous vendez, nous diffusons.</p></div></div></section>
 <section id="book"><h2>Réserver un live</h2><p class="sub">Les lives durent 1h30. Les dates ouvertes commencent le 1er décembre.</p><div class="wiz" id="wiz"></div></section>
 <section><h2>Nos packages</h2><p class="sub">Prix en FCFA, par passage à l’antenne.</p><div class="pk">${db.packages.filter(p=>p.on).map(p=>`<div class="card">${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}<h3>${esc(p.name)} · ${esc(p.dur)}</h3><p>${esc(p.desc)}</p><span class="big">${fmt(p.price)}</span></div>`).join("")}</div></section>
 <footer><span>© OCD Live – prototype de démonstration</span><a href="#admin">Espace admin</a></footer>`;
 wiz();tick();
}
function tick(){const e=$("#cd");if(!e)return;const ms=new Date("2026-12-01T08:00:00").getTime()-Date.now();
 if(ms<=0){e.innerHTML=`<p class="cdt">Les lives sont ouverts</p>`;return}
 const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
 e.innerHTML=`<p class="cdt">Premier live dans</p><div><b>${d}</b><span>jours</span></div><div><b>${h}</b><span>heures</span></div><div><b>${m}</b><span>minutes</span></div><div><b>${s}</b><span>secondes</span></div>`;setTimeout(tick,1000)}
function wiz(){
 const e=$("#wiz");if(!e)return;const N=["Format","Date","Heure","Package","Vos infos"];
 const pr=`<div class="prog">${N.map((_,i)=>`<i class="${i<=w.step?"on":""}"></i>`).join("")}</div>`;
 let h="";
 if(w.ref){const b=db.bookings.find(x=>x.ref==w.ref);h=`<div class="ok"><div class="tick">✓</div><h3>Réservation envoyée</h3><p>Notre équipe vous contacte pour confirmer.</p><div class="ref">${w.ref}</div><p>${dl(b.date)}, ${b.slot}<br>${MODES[b.mode]} · ${esc(pk(b.pkg).name)}</p><button class="btn" onclick="w={step:0,mode:null,date:null,slot:null,pkg:null,f:{},ref:null,err:{}};wiz()">Réserver un autre live</button></div>`}
 else if(w.step==0)h=`${pr}<h3>Où voulez-vous passer en direct ?</h3><div class="opts">${[["onsite","Présentiel à Lomé","Vous venez au studio, une régie dirige votre live."],["remote","À distance","Vous vendez de chez vous, partout en Afrique ou dans le monde. Une assistante vous accompagne."]].map(([k,t,d])=>`<button class="opt ${w.mode==k?"sel":""}" onclick="w.mode='${k}';w.pkg=null;w.step=1;wiz()"><strong>${t}</strong><small>${d}</small></button>`).join("")}</div>`;
 else if(w.step==1){const f=new Date("2026-12-01T12:00").getDay(),off=(f+6)%7;let c=DAYS().map(d=>`<span>${d}</span>`).join("")+"<i></i>".repeat(off);
  for(let d=1;d<=31;d++){const iso="2026-12-"+String(d).padStart(2,"0"),full=SLOTS.every(s=>taken(iso,s));c+=`<button class="${w.date==iso?"sel":""}" ${full?"disabled":""} onclick="w.date='${iso}';w.slot=null;w.step=2;wiz()" aria-label="${dl(iso)}">${d}</button>`}
  h=`${pr}<h3>Quel jour ?</h3><small style="color:var(--mu)">Décembre 2026 · les jours grisés sont complets</small><div class="cal">${c}</div>${back()}`}
 else if(w.step==2)h=`${pr}<h3>${dl(w.date)}</h3><small style="color:var(--mu)">Choisissez l’heure de départ</small><div class="opts">${SLOTS.map(s=>`<button class="opt ${w.slot==s?"sel":""}" ${taken(w.date,s)?"disabled":""} onclick="w.slot='${s}';w.step=3;wiz()"><strong>${s}</strong><small>${taken(w.date,s)?"Déjà réservé":"Disponible"}</small></button>`).join("")}</div>${back()}`;
 else if(w.step==3)h=`${pr}<h3>Choisissez votre package</h3><div class="opts">${db.packages.filter(p=>p.on&&(!p.only||p.only==w.mode)).map(p=>`<button class="opt ${w.pkg==p.id?"sel":""}" onclick="w.pkg='${p.id}';w.step=4;wiz()"><strong>${esc(p.name)} · ${esc(p.dur)}</strong><small>${esc(p.desc)}</small><span class="pr">${fmt(p.price)}</span></button>`).join("")}</div>${back()}`;
 else{const f=w.f,x=w.err,fl=(k,l,t="text",ph="")=>`<label>${l}<input id="f_${k}" type="${t}" value="${esc(f[k]||"")}" placeholder="${ph}" autocomplete="off">${x[k]?`<span class="err">${x[k]}</span>`:""}</label>`;
  h=`${pr}<h3>Vos informations</h3><div class="rec"><strong>${esc(pk(w.pkg).name)}</strong> · ${MODES[w.mode]}<br>${dl(w.date)}, ${w.slot} · ${fmt(pk(w.pkg).price)}</div>
  <div class="fg">${fl("name","Nom complet")}${fl("phone","Téléphone (WhatsApp)","tel","+228 …")}${fl("biz","Votre activité","text","Ex. plats cuisinés, vêtements")}${fl("country","Pays","text","Togo")}${fl("email","E-mail (facultatif)","email")}${fl("product","Produits à présenter (facultatif)")}</div>${back(`<button class="btn" onclick="send()">Envoyer ma réservation</button>`)}`}
 e.innerHTML=h}
const DAYS=()=>["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const back=(r="")=>`<div class="nav"><button class="btn g" onclick="w.step--;wiz()">Retour</button>${r}</div>`;
function send(){
 ["name","phone","biz","country","email","product"].forEach(k=>w.f[k]=($("#f_"+k).value||"").trim());
 const f=w.f,x={};if(f.name.length<3)x.name="Indiquez votre nom complet";if(f.phone.replace(/\D/g,"").length<8)x.phone="Numéro invalide : au moins 8 chiffres";if(!f.biz)x.biz="Dites-nous ce que vous vendez";if(!f.country)x.country="Indiquez votre pays";
 if(f.email&&!/^\S+@\S+\.\S+$/.test(f.email))x.email="Adresse e-mail invalide";
 w.err=x;if(Object.keys(x).length)return wiz();
 if(taken(w.date,w.slot)){toast("Ce créneau vient d’être pris");w.step=2;return wiz()}
 const n=db.bookings.length+1001+Math.floor(Math.random()*90),ref="OCD-"+n;
 db.bookings.push({id:"b"+Date.now(),ref,name:f.name,biz:f.biz,mode:w.mode,date:w.date,slot:w.slot,pkg:w.pkg,status:"pending",phone:f.phone,email:f.email,country:f.country,product:f.product,created:Date.now()});
 db.notifs.unshift({id:"n"+Date.now(),t:Date.now(),msg:`Nouvelle réservation : ${f.name} (${f.biz}), ${dl(w.date)}, ${MODES[w.mode].toLowerCase()}`,read:0});
 save();w.ref=ref;wiz()}
/* ---------- ADMIN ---------- */
const unread=()=>db.notifs.filter(n=>!n.read).length;
function admin(){
 if(!authed){$("#app").innerHTML=`<div class="card lock"><h2>Espace admin</h2><p class="sub" style="margin:8px auto 18px">Saisissez le code d’accès. Code de démonstration : 1234</p><label>Code<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label><p class="err" id="pe"></p><button class="btn" style="width:100%" onclick="login()">Ouvrir</button></div>`;
  $("#pin").addEventListener("keydown",e=>{if(e.key=="Enter")login()});return}
 const T=[["dash","Tableau de bord"],["res","Réservations"],["pack","Packages"],["notif","Notifications"]];
 $("#app").innerHTML=`<div class="adm"><nav class="side">${T.map(([k,l])=>`<button class="${tab==k?"on":""}" onclick="tab='${k}';admin()">${l}${k=="notif"&&unread()?`<span class="bd">${unread()}</span>`:""}</button>`).join("")}<button onclick="authed=false;admin()">Se déconnecter</button></nav><div id="pane"></div></div>`;
 $("#pane").innerHTML=({dash,res,pack:packs,notif})[tab]()}
function login(){if($("#pin").value==db.pin){authed=true;admin()}else $("#pe").textContent="Code incorrect. Réessayez."}
function dash(){
 const B=db.bookings,ok=B.filter(b=>b.status=="confirmed"||b.status=="done"),rev=ok.reduce((s,b)=>s+pk(b.pkg).price,0);
 const wk=[0,0,0,0,0];B.filter(b=>b.status!="cancelled").forEach(b=>wk[Math.min(4,Math.floor((+b.date.slice(8)-1)/7))]++);const mx=Math.max(1,...wk);
 const nx=B.filter(b=>b.status=="confirmed").sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 return`<h2>Tableau de bord</h2><p class="sub">Vue d’ensemble des lives de décembre.</p>
 <div class="kp"><div class="card"><b>${B.length}</b><span>Réservations</span></div><div class="card"><b>${B.filter(b=>b.status=="pending").length}</b><span>À confirmer</span></div><div class="card"><b>${fmt(rev)}</b><span>Chiffre d’affaires confirmé</span></div><div class="card"><b>${B.filter(b=>b.mode=="remote").length}</b><span>Lives à distance</span></div></div>
 <div class="card" style="margin-top:14px"><h3>Réservations par semaine</h3><div class="bars">${wk.map((v,i)=>`<div><i style="height:${v/mx*100}%"></i>${v}<br>S${i+1}</div>`).join("")}</div></div>
 <div class="card" style="margin-top:14px"><h3>Prochains lives confirmés</h3>${nx.length?nx.map(b=>`<p style="margin:10px 0 0"><strong>${dl(b.date)}, ${b.slot}</strong><br><span style="color:var(--mu)">${esc(b.name)} · ${esc(b.biz)} · ${MODES[b.mode]}</span></p>`).join(""):`<p class="sub">Aucun live confirmé. Confirmez une réservation pour la voir ici.</p>`}</div>`}
function res(){
 const L=db.bookings.filter(b=>(!fs||b.status==fs)&&(b.name+b.biz+b.ref+b.phone).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
 return`<h2>Réservations</h2><p class="sub">Confirmez, annulez ou exportez les demandes.</p>
 <div class="tb"><input placeholder="Rechercher un nom, une activité, une référence" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.qt);window.qt=setTimeout(()=>{$('#pane').innerHTML=res();const i=$('#pane input');i.focus();i.setSelectionRange(99,99)},250)" aria-label="Rechercher">
 <select onchange="fs=this.value;$('#pane').innerHTML=res()" aria-label="Filtrer par statut"><option value="">Tous les statuts</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${fs==k?"selected":""}>${v}</option>`).join("")}</select>
 <button class="btn g s" onclick="csv()">Exporter en CSV</button></div>
 <div class="tw"><table><thead><tr><th>Réf.</th><th>Client</th><th>Live</th><th>Package</th><th>Statut</th><th></th></tr></thead><tbody>${L.length?L.map(b=>`<tr><td>${b.ref}</td><td><strong>${esc(b.name)}</strong><br><span style="color:var(--mu)">${esc(b.biz)} · ${esc(b.phone)}</span></td><td>${dl(b.date)}<br><span style="color:var(--mu)">${b.slot} · ${MODES[b.mode]}</span></td><td>${esc(pk(b.pkg).name)}<br><span style="color:var(--mu)">${fmt(pk(b.pkg).price)}</span></td>
 <td><select onchange="setS('${b.id}',this.value)" class="st s-${b.status}" aria-label="Statut">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${b.status==k?"selected":""}>${v}</option>`).join("")}</select></td><td><button class="btn g s" onclick="del('${b.id}')">Supprimer</button></td></tr>`).join(""):`<tr><td colspan="6">Aucune réservation ne correspond à votre recherche.</td></tr>`}</tbody></table></div>`}
function setS(id,v){db.bookings.find(b=>b.id==id).status=v;save();toast("Statut mis à jour");$("#pane").innerHTML=res()}
function del(id){if(!confirm("Supprimer cette réservation ?"))return;db.bookings=db.bookings.filter(b=>b.id!=id);save();toast("Réservation supprimée");$("#pane").innerHTML=res()}
function csv(){const r=[["Réf","Nom","Activité","Téléphone","Pays","Mode","Date","Créneau","Package","Prix","Statut"],...db.bookings.map(b=>[b.ref,b.name,b.biz,b.phone,b.country,MODES[b.mode],b.date,b.slot,pk(b.pkg).name,pk(b.pkg).price,ST[b.status]])];
 const t=r.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");$("#pane").insertAdjacentHTML("beforeend",`<div class="card" style="margin-top:14px"><h3>Export CSV</h3><p class="sub">Copiez ce contenu dans un fichier .csv (le téléchargement direct n’est pas disponible dans l’aperçu).</p><textarea rows="6" readonly onfocus="this.select()">${esc(t)}</textarea></div>`)}
function packs(){return`<h2>Packages</h2><p class="sub">Modifiez les noms, les prix et la visibilité. Les changements s’appliquent tout de suite sur le site.</p><div class="pk">${db.packages.map(p=>`<div class="card"><label>Nom<input value="${esc(p.name)}" onchange="upP('${p.id}','name',this.value)"></label><div class="fg"><label>Prix (FCFA)<input type="number" min="0" step="500" value="${p.price}" onchange="upP('${p.id}','price',+this.value)"></label><label>Durée<input value="${esc(p.dur)}" onchange="upP('${p.id}','dur',this.value)"></label></div><label style="margin-top:12px">Description<textarea rows="2" onchange="upP('${p.id}','desc',this.value)">${esc(p.desc)}</textarea></label><label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" style="width:22px;min-height:22px" ${p.on?"checked":""} onchange="upP('${p.id}','on',this.checked?1:0)">Visible sur le site</label></div>`).join("")}</div>`}
function upP(id,k,v){db.packages.find(p=>p.id==id)[k]=v;save();toast("Package enregistré")}
function notif(){return`<h2>Notifications</h2><p class="sub">Chaque nouvelle réservation arrive ici.</p><div class="tb"><button class="btn g s" onclick="db.notifs.forEach(n=>n.read=1);save();admin()">Tout marquer comme lu</button></div><div class="card">${db.notifs.length?db.notifs.map(n=>`<div class="nt ${n.read?"":"new"}"><div><strong>${esc(n.msg)}</strong><br><span style="color:var(--mu);font-size:13px">${new Date(n.t).toLocaleString("fr-FR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</span></div></div>`).join(""):`<p class="sub">Aucune notification pour le moment.</p>`}</div>`}
/* ---------- ROUTER / THEME ---------- */
function route(){const a=location.hash=="#admin";$("#bAdm").textContent=a?"Retour au site":"Espace admin";a?admin():home();window.scrollTo(0,0)}
$("#bAdm").onclick=()=>{location.hash=location.hash=="#admin"?"":"admin";if(!location.hash)history.replaceState(null,"",location.pathname+location.search);route()};
$("#bTh").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};
addEventListener("hashchange",route);route();
</script>
</body>
</html>
